<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeMark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <h1 class="logo">TubeMark</h1>
      <p class="tagline">Save YouTube videos with progress and notes.</p>
    </header>

    <main class="content">
      <div class="status-badge">Phase 0</div>
      <p class="status-msg">Extension setup complete.</p>

      <div class="empty-state">
        <span class="empty-icon">📭</span>
        <p class="empty-text">No bookmarks yet.</p>
      </div>
    </main>

    <footer class="footer">
      <p class="footer-text">v1.0.0</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
