<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeMark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="../icons/icon48.png" alt="TubeMark Logo" class="logo">
      <h1 class="title">TubeMark</h1>
    </div>
  </header>

  <main class="content">
    <p class="subtitle">Save YouTube videos with progress and notes.</p>

    <div class="badge-container">
      <span class="badge">Phase 0</span>
    </div>

    <div class="status-box">
      <p class="status-title">Extension setup complete.</p>
      <p class="status-message">Ready to load on YouTube pages.</p>
    </div>

    <div class="placeholder-section">
      <p class="no-bookmarks">No bookmarks yet.</p>
    </div>
  </main>

  <footer class="footer">
    <p class="footer-text">TubeMark v1.0.0</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
