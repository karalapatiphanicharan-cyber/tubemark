<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeMark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="header-logo">🔖</span>
      <div class="header-titles">
        <h1 class="title">TubeMark</h1>
        <p class="subtitle">Save YouTube videos for later</p>
      </div>
    </div>
    <button class="settings-btn" aria-label="Settings" title="Settings">⚙️</button>
  </header>

  <main class="main-content">
    <!-- Current Video Section -->
    <section class="section current-video-section" aria-labelledby="current-video-heading">
      <h2 id="current-video-heading" class="section-title">Current Video</h2>

      <div class="video-card">
        <div class="thumbnail-placeholder">
          <!-- An elegant inline SVG representing a video player or film strip -->
          <svg viewBox="0 0 100 56" class="thumbnail-svg" aria-hidden="true">
            <rect width="100" height="56" rx="4" fill="#282828" />
            <polygon points="45,22 45,34 57,28" fill="#ff0000" />
          </svg>
          <span class="demo-badge">Demo Video</span>
        </div>

        <div class="video-details">
          <h3 class="video-title" title="Introduction to Web Development - Beginner Tutorial [Demo Only]">
            Introduction to Web Development - Beginner Tutorial [Demo Only]
          </h3>
          <p class="channel-name">Tech Academy Demo</p>

          <div class="video-meta">
            <span class="timestamp" aria-label="Playback progress">⏱ 00:00</span>
          </div>
        </div>
      </div>

      <!-- Custom Notes Input Field -->
      <div class="note-container collapsed">
        <div class="note-header">
          <label for="video-note" class="note-label">Why are you saving this?</label>
          <button id="toggle-note-btn" class="note-toggle-btn" aria-expanded="false" type="button">+ Add a note</button>
        </div>
        <textarea
          id="video-note"
          class="note-textarea"
          placeholder="e.g. Continue from React Hooks. Important for my project."
          rows="3"
        ></textarea>
        <div class="note-footer">
          <span id="char-counter" class="char-counter">0 / 500</span>
        </div>
      </div>

      <button id="save-bookmark-btn" class="save-btn" aria-label="Save current video bookmark">
        <span>🔖</span> Save Bookmark
      </button>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </section>

    <!-- Saved Bookmarks Section -->
    <section class="section saved-bookmarks-section" aria-labelledby="saved-bookmarks-heading">
      <h2 id="saved-bookmarks-heading" class="section-title">Saved Bookmarks</h2>

      <!-- Search Bar -->
      <div id="search-container" class="search-container hidden">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search saved bookmarks..."
          aria-label="Search saved bookmarks"
        >
        <button id="search-clear-btn" class="search-clear-btn hidden" aria-label="Clear search" type="button">×</button>
      </div>

      <div class="bookmarks-list-container">
        <!-- Bookmark Cards will be dynamically inserted here -->
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">📭</div>
          <h3 class="empty-title">No bookmarks yet</h3>
          <p class="empty-text">Your saved YouTube videos will appear here.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-text">TubeMark v1.0.0 &bull; Phase 1 UI</p>
  </footer>

  <!-- Load utility first to follow DRY principles across the popup context -->
  <script src="../utils/youtube.js"></script>
  <script src="../utils/time.js"></script>
  <script src="../storage/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
